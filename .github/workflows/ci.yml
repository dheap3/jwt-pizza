name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    services:
      mysql:
        image: mysql:8.0.29
        env:
          MYSQL_ROOT_PASSWORD: tempdbpassword
          MYSQL_DATABASE: pizza
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -ptempdbpassword" --health-interval 10s --health-start-period 10s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '{"version": "%s" }' "$version" > public/version.json

      - name: Build
        run: |
          npm ci && npm run build
          cp dist/index.html dist/404.html

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: dheap3/jwt-pizza-service
          path: jwt-pizza-service

      - name: Start backend
        working-directory: jwt-pizza-service
        run: |
          npm ci
          echo "module.exports = {
            jwtSecret: 'ci-test-secret',
            db: {
              connection: {
                host: '127.0.0.1',
                user: 'root',
                password: 'tempdbpassword',
                database: 'pizza',
                connectTimeout: 60000,
              },
              listPerPage: 10,
            },
            factory: {
              url: 'https://pizza-factory.cs329.click',
              apiKey: '${{ secrets.FACTORY_API_KEY }}',
            },
          };" > src/config.js
          nohup npm start > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/order/menu > /dev/null && echo "backend up" && exit 0
            sleep 1
          done
          echo "backend failed to start"; cat backend.log; exit 1

      # - name: Run tests
      #   run: |
      #     npx playwright install --with-deps chromium
      #     npm run test:coverage

      - name: Show backend log
        if: failure()
        run: cat jwt-pizza-service/backend.log

      - name: Update coverage
        run: |
          coverage=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          color=$(echo "$coverage < 80" | bc | awk '{if ($1) print "red"; else print "green"}')
          curl -s -X POST "https://pizza-factory.cs329.click/api/badge/${{ secrets.NET_ID }}/jwtpizzacoverage?label=Coverage&value=$coverage%25&color=$color" -H "authorization: bearer ${{ secrets.FACTORY_API_KEY }}"

      - name: Update pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    permissions:
      id-token: write # Required for requesting the JWT
      contents: read  # Required for actions/checkout
    runs-on: ubuntu-latest
    # This line tells GitHub to look in the 'production' environment for secrets
    environment: production 
    steps:
      - name: Create OIDC token to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.CI_IAM_ROLE }}

      - name: Push to AWS S3
        run: |
          mkdir dist
          printf "<h1>CloudFront deployment with GitHub Actions</h1>" > dist/index.html
          aws s3 cp dist s3://${{ secrets.APP_BUCKET }} --recursive
          aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"
